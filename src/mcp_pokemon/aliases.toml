# Community nicknames that are NOT substrings of an official name.
# alias = "pokeapi-slug"   (species slug, or a variety slug such as "landorus-therian")
# Substrings of official names (咆哮虎 -> 炽焰咆哮虎, "Chomp" -> Garchomp) need no entry:
# the name index already matches them.
# Form prefixes are handled generically too: 超级/阿罗拉/伽勒尔/洗翠/帕底亚/灵兽/化身 and
# メガ/アローラ/ガラル/ヒスイ/パルデア/霊獣/化身 (e.g. 超级暴飞龙, メガボーマンダ, 灵兽土地云).
# Extra entries: set MCP_POKEMON_ALIASES=/path/to/your.toml with the same layout.

